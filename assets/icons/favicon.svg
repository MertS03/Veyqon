<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Vaqon</title>

  <defs>
    <!-- Hintergrund: tiefes Nachtblau, unten rechts ein Hauch Indigo -->
    <linearGradient id="hintergrund" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b1a" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Das V läuft von Violett (links) nach Türkis (rechts) -->
    <linearGradient id="vVerlauf" x1="16" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Weicher Schein hinter dem Funken -->
    <radialGradient id="schein" cx="48" cy="16" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="64" height="64" rx="16" ry="16" fill="url(#hintergrund)" />

  <!-- Feine Kontur für dunkle Browser-Tabs -->
  <rect x="1" y="1" width="62" height="62" rx="15" ry="15"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Schein hinter dem rechten Ende -->
  <circle cx="48" cy="16" r="16" fill="url(#schein)" />

  <!-- Das V aus einer einzigen durchgehenden Linie -->
  <path d="M16 16 L32 46 L48 16"
        fill="none"
        stroke="url(#vVerlauf)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Der Funke am rechten Ende: die automatisch gewählte beste KI -->
  <path d="M48 7
           Q50.5 13.5 57 16
           Q50.5 18.5 48 25
           Q45.5 18.5 39 16
           Q45.5 13.5 48 7 Z"
        fill="#ffffff" />

  <!-- Kleiner Knoten an der Spitze: hier laufen die Anfragen zusammen -->
  <circle cx="32" cy="46" r="2.5" fill="#ffffff" />
</svg>
